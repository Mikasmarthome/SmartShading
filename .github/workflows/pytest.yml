name: Pytest

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    name: Pytest (Stage 1a)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests/ --ignore=tests/real_ha -q -p no:cacheprovider -W error::DeprecationWarning -rw

  real-ha:
    name: Real Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: tests/real_ha/requirements-real-ha.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/real_ha/requirements-real-ha.txt

      - name: Collect (an empty collection is a failure)
        run: |
          python -m pytest tests/real_ha --confcutdir=tests/real_ha -p no:cacheprovider --collect-only -q | tee collected.txt
          count=$(grep -c "::" collected.txt || true)
          echo "collected: $count"
          test "$count" -ge 40

      - name: Run tests
        run: python -m pytest tests/real_ha --confcutdir=tests/real_ha -p no:cacheprovider -q --timeout=180 -rw
